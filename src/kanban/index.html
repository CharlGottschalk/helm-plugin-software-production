<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Helm injects theme tokens, the UI kit and the bridge before this. Shared styles: ../shared/ui.js -->
<style>
  .board { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
  .columns { display: grid; gap: var(--sp-3); overflow-x: auto; padding-bottom: var(--sp-2); }
  .column { display: flex; flex-direction: column; min-height: 320px; background: var(--c-surface); border: 1px solid var(--c-line); border-radius: var(--radius); }
  .column.over { border-color: var(--c-amber); }
  .col-head { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3); border-bottom: 1px solid var(--c-line); background: var(--c-chrome);
    font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--tracking-title); text-transform: uppercase; color: var(--c-text-0); }
  .count { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--c-text-2); }
  .cards { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-2); list-style: none; margin: 0; }
  .empty { padding: var(--sp-3); font-size: var(--fs-sm); color: var(--c-text-2); }
  .card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: var(--sp-3); background: var(--c-surface-raised); border: 1px solid var(--c-line); border-radius: var(--radius-sm); }
  .card:hover { border-color: var(--c-line-strong); }
  .card-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .column.drop { border-color: var(--c-cyan); background: linear-gradient(var(--c-cyan-ghost), var(--c-cyan-ghost)), var(--c-surface); }
  .card[draggable=true] { cursor: grab; }
  .card.busy { opacity: .7; }
  .move { width: auto; height: 24px; padding: 0 var(--sp-2); font-size: var(--fs-xs); }
</style>
</head>
<body>
  <div id="app" class="h-state h-state--loading" role="status" aria-live="polite">Loading…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
